<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kelime Bulucu | Teknobird</title>
<meta name="description" content="Elinizdeki harflerle yazılabilecek Türkçe kelimeleri bulun. Joker, başlayan, biten, içeren harf ve desen filtreleri.">
<style>
:root{--red:#e12e2e;--red-d:#b81a1f;--red-l:#fdecec;--ink:#1c1c24;--mut:#6b6f7b;--line:#e8e9ee;--bg:#f6f7fa}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:transparent;color:var(--ink);padding:6px}
.tool{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:14px;box-shadow:0 6px 24px rgba(20,20,40,.07);overflow:hidden}
.head{padding:16px 20px 0}
.head h1{margin:0;font-size:1.25rem}
.head p{margin:3px 0 0;font-size:.85rem;color:var(--mut)}
.body{padding:14px 20px 8px}
label,.lb{display:block;font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.lb i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.rackrow{display:flex;gap:8px}
.rackrow input{flex:1;min-width:0}
input[type=text],select{width:100%;height:46px;padding:0 12px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid #dcdee6;border-radius:9px;outline:none;transition:.15s}
#rack{font-size:1.15rem;font-weight:600;letter-spacing:.12em}
input[type=text]:focus,select:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(225,46,46,.15)}
.clr{height:46px;padding:0 16px;border:1px solid #dcdee6;background:#fff;color:var(--mut);border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.clr:hover{color:var(--red);border-color:var(--red);background:var(--red-l)}
.tiles{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:38px;margin:10px 0 4px}
.t{width:34px;height:34px;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:800;border-radius:8px;box-shadow:0 3px 0 var(--red-d)}
.t.j{background:#fff;color:var(--red);border:2px dashed var(--red);box-shadow:none}
.note{font-size:.75rem;color:var(--red-d);margin-left:6px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:.88rem;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
#res{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat{font-size:.92rem;margin-bottom:6px}
.stat b{color:var(--red);font-size:1.1rem}
.gh{font-size:.78rem;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.gh span{background:var(--red-l);color:var(--red-d);border-radius:99px;padding:1px 8px;font-size:.7rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.c{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:.92rem;font-weight:500;transition:.12s}
.c:hover{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.more{display:block;margin:14px auto 4px;height:40px;padding:0 20px;border:1px solid var(--red);background:#fff;color:var(--red);border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.more:hover{background:var(--red-l)}
.empty{color:var(--mut);font-size:.9rem;padding:14px;border:1px dashed #d0d3dc;border-radius:10px;text-align:center;line-height:1.7}
.ex{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:2px 9px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;color:var(--ink)}
.ex:hover{border-color:var(--red);color:var(--red)}
.foot{text-align:center;font-size:.7rem;color:var(--mut);padding:6px 0 12px}
.foot a{color:var(--red);text-decoration:none;font-weight:600}
@media(max-width:560px){
  .head{padding:14px 14px 0}.body{padding:12px 14px 6px}
  .filters{grid-template-columns:1fr 1fr}
  .t{width:30px;height:30px;font-size:.9rem}
  .clr{padding:0 10px;font-size:.82rem}
}
</style>
</head>
<body>
<div class="tool">
  <div class="head">
    <h1>Kelime Bulucu</h1>
    <p>Harflerinizi yazın, yazılabilecek Türkçe kelimeleri anında bulun. Joker için <b>?</b> kullanın.</p>
  </div>
  <div class="body">
    <label for="rack">Harfler <span style="text-transform:none;letter-spacing:0;font-weight:500">(joker için ? veya + Joker düğmesi, en fazla 3)</span></label>
    <div class="rackrow">
      <input type="text" id="rack" maxlength="20" placeholder="örn. kitaplık veya kal?m" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="clr" id="jk" title="Joker ekle">+ Joker</button>
      <button type="button" class="clr" id="clr">Temizle</button>
    </div>
    <div class="tiles" id="tiles"></div>

    <div class="filters">
      <div><label for="len">Uzunluk</label><select id="len"><option value="">Tümü</option></select></div>
      <div><label for="pat">Desen <i>(örn. ka?a?)</i></label><input type="text" id="pat" maxlength="15" placeholder="ka?a?" autocomplete="off" spellcheck="false"></div>
      <div><label for="st">Başlayan</label><input type="text" id="st" maxlength="10" placeholder="ka" autocomplete="off" spellcheck="false"></div>
      <div><label for="en">Biten</label><input type="text" id="en" maxlength="10" placeholder="ar" autocomplete="off" spellcheck="false"></div>
      <div><label for="ct">İçeren</label><input type="text" id="ct" maxlength="10" placeholder="al" autocomplete="off" spellcheck="false"></div>
      <div><label for="ex">İçermeyen</label><input type="text" id="ex" maxlength="20" placeholder="öz" autocomplete="off" spellcheck="false"></div>
    </div>
    <label class="chk"><input type="checkbox" id="all"> Tüm harfleri kullan (anagram)</label>

    <div id="res" aria-live="polite"></div>
  </div>
  <div class="foot">Hazırlayan: <a href="https://teknobird.com" target="_blank" rel="noopener">Teknobird</a></div>
</div>

<script>
const A="abcçdefgğhıijklmnoöprsştuüvyz",IX=Object.create(null);[...A].forEach((c,i)=>IX[c]=i);
const $=id=>document.getElementById(id),col=new Intl.Collator('tr');
const low=s=>s.replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase().replace(/â/g,'a').replace(/î/g,'i').replace(/û/g,'u');
const letters=s=>[...low(s)].filter(c=>c in IX).join('');
const rackClean=s=>[...low(s).replace(/[ *_]/g,'?')].filter(c=>c in IX||c==='?').join('');
const patClean=s=>[...low(s).replace(/[ *_]/g,'?')].filter(c=>c in IX||c==='?').join('');
const STEP=150;let W=[],ready=false,shown=STEP,timer,last=[];

for(let i=2;i<=15;i++)$('len').insertAdjacentHTML('beforeend',`<option value="${i}">${i} harf</option>`);

fetch('kelimeler.txt').then(r=>{if(!r.ok)throw 0;return r.text()})
 .then(t=>{W=t.split('\n');ready=true;run()})
 .catch(()=>{$('res').innerHTML='<div class="empty">Sözlük yüklenemedi. Sayfayı yenileyip tekrar deneyin.</div>'});

function run(reset){
  if(reset)shown=STEP;
  const rc=rackClean($('rack').value);let jk=0;const ls=[];
  for(const c of rc){c==='?'?jk++:ls.push(c)}
  const over=jk>3;jk=Math.min(jk,3);
  let jt=0;
  $('tiles').innerHTML=[...rc].map(c=>c==='?'?(++jt>3?'':'<span class="t j">?</span>'):`<span class="t">${c.toLocaleUpperCase('tr')}</span>`).join('')+(over?'<span class="note">En fazla 3 joker kullanılır.</span>':'');
  const n=ls.length+jk,L=+$('len').value||0,pt=patClean($('pat').value),st=letters($('st').value),en=letters($('en').value),ct=letters($('ct').value),ex=[...letters($('ex').value)],all=$('all').checked;
  const re=pt?new RegExp('^'+pt.replace(/\?/g,'.')+'$'):null;
  if(!n&&!L&&!pt&&!st&&!en&&!ct){
    $('res').innerHTML='<div class="empty">Harflerinizi yukarıya yazın. Örnekler: <button class="ex" data-ex="kitaplık">kitaplık</button> <button class="ex" data-ex="kal?m">kal?m</button> <button class="ex" data-ex="elma?">elma?</button></div>';return}
  if(!ready){$('res').innerHTML='<div class="empty">Sözlük yükleniyor…</div>';return}
  const base=new Uint8Array(29),c=new Uint8Array(29),out=[];
  ls.forEach(x=>base[IX[x]]++);
  for(const w of W){
    const wl=w.length;
    if(L&&wl!==L)continue;
    if(re&&!re.test(w))continue;
    if(st&&!w.startsWith(st))continue;
    if(en&&!w.endsWith(en))continue;
    if(ct&&!w.includes(ct))continue;
    if(ex.length&&ex.some(x=>w.includes(x)))continue;
    if(n){
      if(all?wl!==n:wl>n)continue;
      c.set(base);let need=0,ok=true;
      for(let i=0;i<wl;i++){const k=IX[w[i]];if(c[k]>0)c[k]--;else if(++need>jk){ok=false;break}}
      if(!ok)continue}
    out.push(w)}
  out.sort((a,b)=>b.length-a.length||col.compare(a,b));
  last=out;render();
}
function render(){
  const out=last;
  if(!out.length){$('res').innerHTML='<div class="empty">Eşleşen kelime bulunamadı. Filtreleri azaltmayı veya joker (?) eklemeyi deneyin.</div>';return}
  let h=`<div class="stat"><b>${out.length.toLocaleString('tr-TR')}</b> kelime bulundu</div>`,budget=shown;
  const g={};out.forEach(w=>(g[w.length]=g[w.length]||[]).push(w));
  for(const k of Object.keys(g).sort((a,b)=>b-a)){
    if(budget<=0)break;
    const list=g[k],part=list.slice(0,budget);budget-=part.length;
    h+=`<div class="gh">${k} harfli <span>${list.length}</span></div><div class="chips">${part.map(w=>`<span class="c">${w}</span>`).join('')}</div>`}
  if(out.length>shown)h+=`<button type="button" class="more" id="more">Daha fazla göster</button>`;
  $('res').innerHTML=h;
}
const debounced=()=>{clearTimeout(timer);timer=setTimeout(()=>run(true),120)};
['rack','len','pat','st','en','ct','ex','all'].forEach(id=>$(id).addEventListener(id==='len'||id==='all'?'change':'input',debounced));
$('jk').onclick=()=>{const v=$('rack').value;if((v.match(/\?/g)||[]).length<3){$('rack').value=v+'?';run(true)}$('rack').focus()};
$('clr').onclick=()=>{['rack','pat','st','en','ct','ex'].forEach(id=>$(id).value='');$('len').value='';$('all').checked=false;run(true)};
$('res').addEventListener('click',e=>{
  const x=e.target.closest('[data-ex]');if(x){$('rack').value=x.dataset.ex;run(true);return}
  if(e.target.id==='more'){shown+=STEP;render()}});

function sendHeight(){try{parent.postMessage({frameHeight:Math.ceil(document.querySelector('.tool').getBoundingClientRect().height)+12},'*')}catch(e){}}
window.addEventListener('load',()=>{sendHeight();setTimeout(sendHeight,300)});
window.addEventListener('resize',sendHeight);
if(window.ResizeObserver)new ResizeObserver(sendHeight).observe(document.querySelector('.tool'));
run();
</script>
</body>
</html>
